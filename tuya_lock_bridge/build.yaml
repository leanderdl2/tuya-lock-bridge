# python:3.12-alpine publishes both architectures, so one base image covers
# everything this add-on is built for.
build_from:
  amd64: "python:3.12-alpine"
  aarch64: "python:3.12-alpine"
labels:
  org.opencontainers.image.source: "https://github.com/leanderdl2/tuya-lock-bridge"
  org.opencontainers.image.licenses: "MIT"
